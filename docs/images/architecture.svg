<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Classes Pro Admin architecture</title>
  <desc id="desc">Flutter presentation connects through repositories to a Drift local database and a synchronization engine backed by Firebase Authentication and Cloud Firestore.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8faff"/><stop offset="1" stop-color="#edf3ff"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8693aa"/></marker>
    <filter id="s2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1d3261" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1400" height="760" rx="36" fill="url(#bg2)"/>
  <text x="70" y="82" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#151d2f">Offline-capable, cloud-connected architecture</text>
  <text x="70" y="124" font-family="Arial, sans-serif" font-size="21" fill="#657089">Clear layers keep UI, domain rules, persistence, synchronization, and external services independently testable.</text>

  <g fill="none" stroke="#8693aa" stroke-width="3" marker-end="url(#arrow)">
    <path d="M330 285H420"/><path d="M670 285H760"/><path d="M1010 285H1100"/>
    <path d="M885 370V470"/><path d="M805 530H660"/>
  </g>
  <path d="M535 370V470" fill="none" stroke="#8693aa" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#s2)" font-family="Arial, sans-serif">
    <g><rect x="70" y="190" width="260" height="180" rx="26" fill="#ffffff"/><rect x="70" y="190" width="260" height="12" rx="6" fill="#2f6fed"/><text x="100" y="247" font-size="25" font-weight="700" fill="#172033">Flutter UI</text><text x="100" y="282" font-size="17" fill="#68748c">Screens &amp; widgets</text><text x="100" y="311" font-size="17" fill="#68748c">Responsive theme</text><text x="100" y="340" font-size="17" fill="#68748c">Role-aware navigation</text></g>
    <g><rect x="420" y="190" width="250" height="180" rx="26" fill="#ffffff"/><rect x="420" y="190" width="250" height="12" rx="6" fill="#1e9c69"/><text x="450" y="247" font-size="25" font-weight="700" fill="#172033">Repositories</text><text x="450" y="282" font-size="17" fill="#68748c">Domain operations</text><text x="450" y="311" font-size="17" fill="#68748c">Local/remote sources</text><text x="450" y="340" font-size="17" fill="#68748c">Entity mappers</text></g>
    <g><rect x="760" y="190" width="250" height="180" rx="26" fill="#ffffff"/><rect x="760" y="190" width="250" height="12" rx="6" fill="#7d4dcc"/><text x="790" y="247" font-size="25" font-weight="700" fill="#172033">Sync engine</text><text x="790" y="282" font-size="17" fill="#68748c">Queued mutations</text><text x="790" y="311" font-size="17" fill="#68748c">Deduplication</text><text x="790" y="340" font-size="17" fill="#68748c">Conflict-aware pulls</text></g>
    <g><rect x="1100" y="190" width="230" height="180" rx="26" fill="#ffffff"/><rect x="1100" y="190" width="230" height="12" rx="6" fill="#f2a313"/><text x="1130" y="247" font-size="25" font-weight="700" fill="#172033">Firebase</text><text x="1130" y="282" font-size="17" fill="#68748c">Authentication</text><text x="1130" y="311" font-size="17" fill="#68748c">Cloud Firestore</text><text x="1130" y="340" font-size="17" fill="#68748c">Security rules</text></g>
    <g><rect x="400" y="470" width="260" height="180" rx="26" fill="#ffffff"/><rect x="400" y="470" width="260" height="12" rx="6" fill="#2f6fed"/><text x="430" y="527" font-size="25" font-weight="700" fill="#172033">Permissions</text><text x="430" y="562" font-size="17" fill="#68748c">Role defaults</text><text x="430" y="591" font-size="17" fill="#68748c">Granular action keys</text><text x="430" y="620" font-size="17" fill="#68748c">Active/pending access</text></g>
    <g><rect x="760" y="470" width="250" height="180" rx="26" fill="#ffffff"/><rect x="760" y="470" width="250" height="12" rx="6" fill="#1e9c69"/><text x="790" y="527" font-size="25" font-weight="700" fill="#172033">Drift / SQLite</text><text x="790" y="562" font-size="17" fill="#68748c">Local tables &amp; DAOs</text><text x="790" y="591" font-size="17" fill="#68748c">Reactive queries</text><text x="790" y="620" font-size="17" fill="#68748c">Persistent sync queue</text></g>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="70" y="690" width="1260" height="40" rx="20" fill="#ffffff" stroke="#d8e1f2"/>
    <text x="700" y="716" text-anchor="middle" font-size="17" font-weight="700" fill="#526079">Supporting services: PDF reports • invoices • receipts • sharing • backups • institute settings</text>
  </g>
</svg>
