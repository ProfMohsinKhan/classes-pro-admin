<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Classes Pro Admin feature map</title>
  <desc id="desc">A visual overview of dashboard, students, attendance, fees, academics, reports, permissions, and offline sync features.</desc>
  <defs>
